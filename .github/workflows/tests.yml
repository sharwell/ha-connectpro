name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: serialx ${{ matrix.serialx }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Cover the minimum, HA 2026.10.2's version, and future 1.x releases.
        serialx: ["==1.10.0", "==1.11.0", ">=1.10.0,<2.0.0"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-test.txt
      - name: Install test dependencies
        env:
          SERIALX_SPECIFIER: ${{ matrix.serialx }}
        run: python -m pip install -r requirements-test.txt "serialx$SERIALX_SPECIFIER"
      - name: Run tests
        run: python -m pytest
      - name: Check style
        run: |
          python -m ruff check .
          python -m ruff format --check .
