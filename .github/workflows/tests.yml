name: Tests

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    name: ${{ matrix.name }} Home Assistant
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Minimum
            python: "3.12"
          - name: Recent
            ha: "2026.11.2"
    steps:
      - uses: actions/checkout@v4
      - name: Read Home Assistant release metadata
        id: release
        shell: bash
        env:
          HA_RELEASE: ${{ matrix.ha }}
          MINIMUM_PYTHON: ${{ matrix.python }}
        run: |
          release="$HA_RELEASE"
          serialx_floor=""
          python_file="$RUNNER_TEMP/ha-python-version"
          if [[ -z "$release" ]]; then
            release=$(sed -n 's/^homeassistant==//p' requirements-test.txt)
            serialx_floor=$(sed -n 's/^serialx==//p' requirements-test.txt)
            [[ "$serialx_floor" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
            printf '%s\n' "$MINIMUM_PYTHON" > "$python_file"
          fi
          [[ "$release" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          source="https://raw.githubusercontent.com/home-assistant/core/$release"
          curl -fsSL --retry 3 "$source/homeassistant/package_constraints.txt" \
            -o "$RUNNER_TEMP/ha-constraints.txt"
          if [[ -n "$HA_RELEASE" ]]; then
            curl -fsSL --retry 3 "$source/.python-version" -o "$python_file"
          fi
          printf 'ha=%s\nserialx-floor=%s\n' "$release" "$serialx_floor" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v5
        with:
          python-version-file: ${{ runner.temp }}/ha-python-version
          cache: pip
          cache-dependency-path: |
            requirements-test.txt
            requirements-test-common.txt
            .github/workflows/tests.yml
      - name: Install and verify test environment
        shell: bash
        env:
          HA_RELEASE: ${{ steps.release.outputs.ha }}
          SERIALX_FLOOR: ${{ steps.release.outputs.serialx-floor }}
        run: |
          constraints="$RUNNER_TEMP/ha-constraints.txt"
          if [[ -n "$SERIALX_FLOOR" ]]; then
            python -m pip install -c "$constraints" -r requirements-test.txt
          else
            python -m pip install -c "$constraints" -r requirements-test-common.txt \
              "homeassistant==$HA_RELEASE"
          fi
          python -m pip check
          python tests/check_environment.py \
            --home-assistant "$HA_RELEASE" \
            --python-version-file "$RUNNER_TEMP/ha-python-version" \
            --constraints "$constraints" \
            --serialx-floor "$SERIALX_FLOOR"
      - name: Run tests
        run: python -m pytest
      - name: Check style
        run: |
          python -m ruff check .
          python -m ruff format --check .
